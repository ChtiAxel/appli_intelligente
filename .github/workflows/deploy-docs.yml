name: Deploiement Documentation MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation de MkDocs et Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Compilation du site web statique
        run: mkdocs build

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Televersement de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
