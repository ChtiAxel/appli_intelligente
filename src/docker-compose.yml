services:
  app:
    build:
      context: .
      dockerfile: NaturSQL/docker/Dockerfile
    ports:
      - "7860:7860"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
