services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "7860:7860"
    environment:
      OLLAMA_BASE_URL: http://10.22.28.190:11434
      OLLAMA_MODEL: gemma2:latest
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: appia
      DB_USER: appia
      DB_PASSWORD: appia_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.1
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: appia
      MARIADB_USER: appia
      MARIADB_PASSWORD: appia_password
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./src/NaturSQL/docs/bdd/appia.sql:/docker-entrypoint-initdb.d/01-appia.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
